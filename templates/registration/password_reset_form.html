{% extends 'base.html' %}

{% block title %}Reset password{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-5">
        <div class="card shadow-sm">
            <div class="card-body">
                <h2 class="fw-bold mb-4">Reset password</h2>
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button class="btn btn-primary" type="submit">Send reset link</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
