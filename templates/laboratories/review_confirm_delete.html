{% extends 'base.html' %}

{% block title %}Delete Review{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-5">
        <div class="card shadow-sm">
            <div class="card-body">
                <h2 class="fw-bold mb-3">Delete review?</h2>
                <p>Are you sure you want to delete this review?</p>
                <form method="post">
                    {% csrf_token %}
                    <button class="btn btn-danger" type="submit">Delete</button>
                    <a href="{% url 'laboratory-detail' object.laboratory.slug %}" class="btn btn-outline-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
